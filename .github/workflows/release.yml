name: Release

# Publishing is irreversible: npm unpublish is heavily restricted after 72
# hours, and a GitHub Release tag is what `npm/ntl-cli`'s postinstall fetches
# from. So this never runs on a push to main — only on an explicit tag, or a
# dispatch with dry_run for rehearsing the whole thing without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write        # create the release and upload assets
  id-token: write        # npm provenance attestation

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Refuse to release anything the repository does not agree about. A tag that
  # disagrees with the manifests would publish one version under another's name.
  verify:
    name: Verify version agreement
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Read and cross-check the version
        run: |
          set -euo pipefail
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cli_v=$(node -p "require('./npm/ntl-cli/package.json').version")
          mcp_v=$(node -p "require('./mcp/ntl-postgres-mcp-server/package.json').version")

          echo "workspace: $cargo_v"
          echo "ntl-cli:   $cli_v"
          echo "mcp:       $mcp_v"

          if [ "$cargo_v" != "$cli_v" ] || [ "$cargo_v" != "$mcp_v" ]; then
            echo "::error::version mismatch — Cargo.toml $cargo_v, ntl-cli $cli_v, mcp $mcp_v"
            exit 1
          fi

          # On a tag, the tag is the authority and must match.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_v="${GITHUB_REF_NAME#v}"
            if [ "$tag_v" != "$cargo_v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_v"
              exit 1
            fi
          fi

          # A prerelease must not land on npm's `latest`, or `npm i @bundu/ntl-cli`
          # hands a beta to everyone. Derive the dist-tag from the version itself
          # rather than hardcoding it, so this stays correct after 1.0.
          if [[ "$cargo_v" == *-* ]]; then
            npm_tag="${cargo_v#*-}"; npm_tag="${npm_tag%%.*}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            npm_tag="latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$cargo_v"  >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag"  >> "$GITHUB_OUTPUT"
          echo "npm dist-tag: $npm_tag"

      - name: Report which npm credential is available
        # Deliberately not fatal. There are two viable mechanisms and only one
        # of them uses a secret:
        #   - trusted publishing (OIDC), which needs no token at all and is
        #     what npm's own guidance points at;
        #   - a token with read-write on the whole @bundu scope.
        # A token restricted to selected packages cannot create a new one — that
        # is a 403 on PUT which ignores --otp entirely, so it reads like an auth
        # failure rather than a permissions one.
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is visible; it must have read-write on the whole" \
                 "@bundu scope, not selected packages, to create a new package."
          else
            echo "::warning::No NPM_TOKEN visible. This only works if trusted" \
                 "publishing (OIDC) is configured for both packages on npmjs.com." \
                 "If it is not, the publish step will fail with a 403."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # One job per asset name in npm/ntl-cli/scripts/install.mjs TARGETS. The names
  # below must match that table exactly — the postinstall fetches them by name.
  build:
    name: ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing should not hide the others
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ntl-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ntl-aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ntl-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ntl-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ntl-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the CLI
        run: cargo build --release -p ntl-cli --target ${{ matrix.target }}

      - name: Name the binary as the postinstall expects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/ntl.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/ntl" "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi

      - name: It runs
        # A binary that cannot report its own version is not worth shipping.
        # Skipped when cross-compiling, where the host cannot execute it.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./dist/${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: checksums.txt
        # `sha256sum` output is exactly the format install.mjs parses:
        # "<hex>  <bare asset name>", split on whitespace, matched on field 2.
        # Generated from inside the directory so no path prefix creeps in.
        run: |
          set -euo pipefail
          cd staging
          ls -l
          sha256sum ntl-* > checksums.txt
          cat checksums.txt

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v${VERSION}" staging/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --generate-notes \
            "${flags[@]}"

  # ---------------------------------------------------------------------------
  # After the release, never before: the postinstall downloads from the release
  # tag, so publishing first guarantees a window where every install falls back
  # to "build it from source".
  npm:
    name: Publish to npm
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: The MCP tarball carries a usable template
        # No build step: this package has no `main`. Its entry transitively
        # text-imports a .sql file, which only a bundler can resolve — Node
        # cannot load .sql at all — so promising Node importability would be a
        # promise it could never keep. What ships is the source, its tests and
        # its wrangler config, because the package exists to be copied and
        # deployed rather than imported.
        working-directory: mcp/ntl-postgres-mcp-server
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tail -5
          for required in src/index.ts wrangler.toml README.md; do
            npm pack --dry-run --json 2>/dev/null \
              | node -e "
                  const f=JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(x=>x.path);
                  if (!f.includes('$required')) { console.error('::error::$required missing from the tarball'); process.exit(1); }
                "
          done
          echo "tarball carries src/, wrangler.toml and README.md"

      - name: Publish @bundu/ntl-cli
        if: github.event_name == 'push'
        working-directory: npm/ntl-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          TAG: ${{ needs.verify.outputs.npm_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run after a partial failure should not fail for the
          # one reason that is not a problem — npm refusing to republish a
          # version that is already there.
          if npm view "@bundu/ntl-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@bundu/ntl-cli@${VERSION} is already published; skipping."
          else
            npm publish --access public --tag "${TAG}"
          fi

      - name: Publish @bundu/ntl-postgres-mcp-server
        if: github.event_name == 'push'
        working-directory: mcp/ntl-postgres-mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          TAG: ${{ needs.verify.outputs.npm_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@bundu/ntl-postgres-mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "@bundu/ntl-postgres-mcp-server@${VERSION} is already published; skipping."
          else
            npm publish --access public --tag "${TAG}"
          fi

      - name: Dry run summary
        if: github.event_name != 'push'
        run: |
          echo "Dry run: built everything, published nothing."
          echo "Version:  ${{ needs.verify.outputs.version }}"
          echo "dist-tag: ${{ needs.verify.outputs.npm_tag }}"
