name: Staging version

# Org versioning policy (nyuchi/.github#80): every merge into `staging`
# (the live beta) is released as the next PATCH, tagged on the merged
# commit; releasing staging to main is the next MINOR; a MAJOR is only ever
# made by hand (run this or the main release workflow with bump: major).
# Each segment holds 0..999: patch 999 rolls into the next minor; minor 999
# stops and asks for a manual major.
#
# The tag is pushed with GITHUB_TOKEN, so tag-triggered publish workflows do
# not ship beta builds. The logic is nyuchi/.github's
# reusable-staging-release.yml and its next-version action.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the patch bump (a major is only ever made by hand).
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  version:
    # A manual run started from main (the default in the Run workflow form)
    # would tag main's HEAD as a staging beta. Only staging is versioned here.
    if: github.ref == 'refs/heads/staging'
    uses: nyuchi/.github/.github/workflows/reusable-staging-release.yml@924e5b4d0983d31379aedbec02b990793f29c792  # main, 2026-10-04
    with:
      bump: ${{ inputs.bump || '' }}
    permissions:
      contents: write
